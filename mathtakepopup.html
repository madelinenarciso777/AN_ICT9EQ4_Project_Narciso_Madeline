<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Confirmation - Virtual Notebooks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
    *{
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        font-weight: normal;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
        background-image: url(basicback.png);
        background-size: cover; 
        background-attachment: fixed;
        background-position: center; 
        background-color: #222222;
    }
    
    header {
        background-color: #c39c5b;
        height: 70px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 30px;
    }

     .header-logo{
        width: auto;
        max-width: 210px;
        max-height: 55px;
        object-fit: contain;
        display: block;
    }

    .header-logout{
        display: flex; 
        align-items: center;
        justify-content: center;
        font-size: 25px;
        padding: 8px;
        color: #1a1a1a;
        text-decoration: none;
    }

    .header-logout:hover{
        color: rgba(0, 0, 0, 0.247);
        padding-left: 30px;
    }
    .header-profile:hover {
        text-decoration: underline;
    }

    .wrapper {
        display: flex;
        flex: 1;
    }

    nav{
        background-color: black;
        width: 260px;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        padding: 20px 0;
        box-shadow: 2px 0px 10px rgba(0,0,0,0.5);
        flex-shrink: 0;
        justify-content: flex-start ;
        align-items: center;
    }

    .avatar{
        width: 120px; 
        height: 120px;
        border-radius: 50%;
        background-color: #222222;
        border: 3px solid #c39c5b;
        display: flex;
        align-items: center;
        overflow: hidden;
        margin-bottom: 18px;
        justify-content: center;
    }

    .avatar:hover{
        border-color: #fcc260;
        transform: scale(1.05);
        transition: all 0.3s ease;
    }

    .avatar i{
        font-size: 3rem;
        color: #c39c5b;
    }


    .sidebar-profile{
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 30px;
        margin-top: 2.5rem;
    }

    .nav-button{
        color: #c39c5b;
        text-decoration: none;
        padding: 10px 25px;
        margin: 6px 0;
        font-size: 1.3rem; 
        display: inline-block;
        width: 100%;

        transition: all 0.3s ease;
        border-left: 3px solid transparent;
    }

    .nav-button:hover{
        background-color: #1a1a1a;
        color: white;
        border-left: 3px solid #c39c5b;
        padding-left: 30px;
    }

    main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        padding-bottom: 50px;
    }

    .content-area {
        padding: 60px 50px;
        display: flex;
        justify-content: center;
        align-items: center;
        flex: 1;
    }

    .confirm-card {
        background-color: #2e2e2e;
        border: 1px solid #3a3a3a;
        border-radius: 12px;
        padding: 40px;
        width: 100%;
        max-width: 450px;
        text-align: center;
        color: #f5f0e6;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .confirm-card h2 {
        color: #c39c5b;
        font-weight: bold;
        margin-bottom: 20px;
    }

    .divider {
        height: 2px;
        background: linear-gradient(to right, transparent, #c39c5b, transparent);
        margin: 15px 0;
    }

    .task-name {
        font-size: 1.4rem;
        font-weight: bold;
        margin-bottom: 5px;
    }

    .from-deadline {
        color: #aaaaaa;
        font-size: 0.9rem;
    }

    .to-deadline {
        color: #aaaaaa;
        font-size: 0.9rem;
        margin-bottom: 30px;
    }
    .btn-container {
        display: flex;
        gap: 15px;
        justify-content: center;
    }

    .cancel-btn {
        background-color: transparent;
        color: #f5f0e6;
        border: 1px solid #444;
        padding: 10px 25px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: bold;
        transition: background 0.3s;
    }

    .cancel-btn:hover {
        background-color: #333;
        color: #ffffff;
    }

    .take-btn {
        background-color: #c39c5b;
        color: black;
        padding: 10px 25px;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s;
    }

    .take-btn:hover {
        background-color: #e0b46db0;
    }

    footer {
        background-color: #c39c5b;
        min-height: 60px; 
        width: 100%;
        display: flex;
        flex-direction: column; 
        align-items: center;
        justify-content: center;
        color: black;
        font-size: 0.95rem;
        padding: 10px 0; 
    }
    </style>

    <script>
        function takeAlert(){
            alert("This activity is not yet available for taking.")
        }
    </script>
</head>
<body>
    
    <header>
        <a href="dashboard.html" >
            <img src="IMAGES/logostylecss/logo.webp" class="header-logo">
        </a>
        <a href="logout.html" class="header-logout">
            <i class="fa-solid fa-right-from-bracket"></i>
        </a>
    </header>

    <div class="wrapper">
        <nav>

            <div class="sidebar-profile">
                <a href="profile.html">
                    <div class="avatar">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </a>
            </div>

            <a href="dashboard.html" class="nav-button">Dashboard</a>
            <a href="notebooks.html" class="nav-button">Notebooks</a>
            <a href="tasks.html" class="nav-button">Assignments</a>
        </nav>

        <main>
            <div class="content-area">
                <div class="confirm-card">
                    <h2>Take this activity?</h2>
                    <div class="divider"></div>
                    <p class="task-name">Drill Sheet 2</p>
                    <p class="from-deadline">Date Start: April 13, 2026 | 8:00 A.M.</p>
                    <p class="to-deadline">Date End: April 13, 2026 | 8:30 A.M.</p>
                    
                    <div class="btn-container">
                        <a href="tasks.html" class="cancel-btn">Cancel</a>
                        <button class="take-btn" onclick="takeAlert()">Take Activity</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <footer class="p-3 text-center">  <div>Tungul | Narciso, M | Chu Tan | 9 - Emerald &copy; 2026</div>
        <div class="footer-source">Source: OBMC, AI: ChatGPT, Claude, Gemini</div>
    </footer>
    
</body>
</html>
